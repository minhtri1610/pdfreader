name: Build Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            name: Windows
          - os: macos-latest
            architecture: x64
            name: macOS-Intel
          - os: macos-latest
            architecture: arm64
            name: macOS-AppleSilicon

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: ${{ matrix.architecture }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller Pillow

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --windowed --name="KailashPDFReader" --icon="K.png" main.py
        powershell Compress-Archive -Path dist/KailashPDFReader.exe -DestinationPath dist/KailashPDFReader-Windows.zip -Force

    - name: Build with PyInstaller (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        pyinstaller --noconsole --onefile --windowed --name="KailashPDFReader" --icon="K.png" main.py
        hdiutil create -volname "KailashPDFReader" -srcfolder dist/KailashPDFReader.app -ov -format UDZO dist/KailashPDFReader.dmg

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: KailashPDFReader-Windows
        path: dist/KailashPDFReader-Windows.zip

    - name: Upload Artifact (macOS Intel)
      if: matrix.os == 'macos-latest' && matrix.architecture == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: KailashPDFReader-macOS-Intel
        path: dist/KailashPDFReader.dmg

    - name: Upload Artifact (macOS Apple Silicon)
      if: matrix.os == 'macos-latest' && matrix.architecture == 'arm64'
      uses: actions/upload-artifact@v4
      with:
        name: KailashPDFReader-macOS-AppleSilicon
        path: dist/KailashPDFReader.dmg
